[package]
name = "rcargo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Drop-in cargo replacement that offloads builds to a remote host."

[[bin]]
name = "rcargo"
path = "src/main.rs"

[features]
default = []
# Mirror of rcargo-client's webtransport feature — forwards to the
# client crate. Enables the `--rcargo-transport=webtransport` flag.
webtransport = ["rcargo-client/webtransport"]

[dependencies]
rcargo-client = { path = "../rcargo-client" }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which.workspace = true

[dev-dependencies]
tempfile = "3"
