[workspace]
resolver = "2"
members = [
    "crates/rcargo-cli",
    "crates/rcargo-client",
    "crates/rcargod",
    "crates/rcargo-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pyrosec/rcargo"
authors = ["pyrosec"]
description = "Drop-in cargo replacement that offloads builds to a remote host."

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
which = "6"
bytes = "1"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
